<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Seas Fishing</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6d0;--card:#fbf6e8;--ink:#10303f;--mute:#5d6f74;--sea:#1b6b78;--deep:#0e3b4d;--boat:#c9402a;--gold:#e0a02c;--ok:#2f8a55;--line:#d6c9a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1b24;--card:#122a37;--ink:#eadfc3;--mute:#9db0b3;--sea:#4fb0bd;--deep:#071720;--boat:#ef6a50;--gold:#f0b94d;--ok:#5fcf8c;--line:#25485a}}
:root[data-theme="dark"]{--bg:#0b1b24;--card:#122a37;--ink:#eadfc3;--mute:#9db0b3;--sea:#4fb0bd;--deep:#071720;--boat:#ef6a50;--gold:#f0b94d;--ok:#5fcf8c;--line:#25485a;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:end;margin-bottom:10px}
h1{margin:0;font-size:clamp(24px,5vw,34px);font-weight:800;line-height:1.1}
h2{margin:14px 0 6px;font-size:18px;font-weight:800}
.stats{display:flex;gap:8px;align-items:stretch}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--mute)}
.gear{padding:0 10px;display:flex;align-items:center}
nav{display:flex;gap:6px;margin-bottom:10px}
.btn,.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn[aria-pressed=true],.chip[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}
.btn.go{background:var(--boat);border-color:var(--boat);color:#fff;font-weight:800;min-width:170px;touch-action:none;user-select:none}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
.btn:disabled,.chip:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,canvas:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;background:#7fc8ee}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.hint{font-size:14px;color:var(--mute);margin:6px 0 0}
#msg{min-height:24px;font-weight:600;margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--mute)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fc.lock{opacity:.7}.fc h3{margin:0;font-size:16px}.fc i{font-size:13px;color:var(--mute)}.fc p{margin:4px 0 0;font-size:13px}
.pic{background:#f6f2e6;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;padding:10px}
.pic img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}.pic svg{width:55%;height:auto}.sil{filter:brightness(0);opacity:.18}
.bd{padding:10px 12px 12px}
.new{background:var(--gold);color:#000;border-radius:8px;padding:0 6px;font-size:12px;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(5,20,28,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:16px 18px;border-top:6px solid var(--boat)}
.modal h2{margin:0}.sec{padding:10px 0;border-bottom:1px solid var(--line)}.sec>b{display:block;margin-bottom:6px}
.mh{display:flex;justify-content:space-between;align-items:center}
input[type=text]{flex:1;min-width:140px;font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{flex:1;min-width:140px;accent-color:var(--boat)}
#cres{min-height:22px;font-weight:600;margin-top:6px}
.mapgrid{display:grid;grid-template-columns:1fr;gap:14px}#locinfo{column-count:2;column-gap:28px;border-top:1px solid var(--line);padding-top:12px}#locinfo>*{break-inside:avoid}@media(max-width:760px){#locinfo{column-count:1}}svg.map{min-height:260px}
svg.map{width:100%;height:auto;display:block;border-radius:12px}svg.map [data-l]{cursor:pointer}svg.map [data-l]:focus-visible{outline:3px solid #ffd45a}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff;vertical-align:middle}
.frow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}.frow img{width:52px;background:#f6f2e6;border-radius:6px;mix-blend-mode:multiply}
.lk{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin:8px 0}.lk b{color:var(--mute);font-weight:600}
[hidden]{display:none!important}
</style></head><body>

function mkt(){const th=X('cm'),items=G.bag.map((it,i)=>({it,i,v:val(it)})).sort((a,b)=>b.v-a.v),tot=items.reduce((a,b)=>a+b.v,0);
let h=`<h2 style="margin-top:0">${X('market')}</h2><p class="hint">${X('formula')}</p>${mkm?`<p class="kv" style="color:var(--boat)"><b>${mkm}</b></p>`:''}<div class="row">${Object.keys(G.dem).map(id=>{const f=FISH.find(x=>x.id===id),m=G.dem[id];return `<span class="chip" style="cursor:default">${m>1?'▲':'▼'} ${fn(f)} ×${m}</span>`}).join('')}</div><p class="hint">${X('dnote',10-G.mc%10)}</p>`;
h+=`<div class="item"><span>${X('inbag',G.bag.length)}<small>${X('worth',tot.toLocaleString())}</small></span><button class="btn" data-s="all" ${G.bag.length?'':'disabled'}>${X('sell')}</button></div>`;
h+=items.length?`<div style="max-height:360px;overflow:auto">${items.map(({it,i,v})=>{const f=FISH.find(x=>x.id===it.id),m=dm(it.id),im=IMG[f.id];return `<div class="item"><span style="display:flex;gap:10px;align-items:center">${im?`<img src="${im}" alt="" width="64" style="mix-blend-mode:multiply;background:#f6f2e6;border-radius:6px">`:''}<span><b>${fn(f)}</b> ${it.ill?'⚠ ':''}${it.cm} ${th}<small>${X('size')} ×${sizeM(f,it.cm).toFixed(2)} · ${X('qual')} ${X('q'+qi(it.q||1))} ×${(it.q||1).toFixed(2)} · ${X('dem')} ${m>1?X('hotl'):m<1?X('slowl'):X('norml')} ×${m}</small></span></span><button class="btn" data-s="${i}">${X('sellb')} ${v.toLocaleString()}</button></div>`}).join('')}</div>`:`<p class="hint">${X('empty')}</p>`;
const st=G.stat,pc=st.c?Math.round(st.v/st.c):0,pm=st.sec>30?Math.round(st.v/(st.sec/60)):0,nc=BCOST[G.boat+1];
h+=`<h2>${X('stats')}</h2><div class="item"><span>${X('cnt')}</span><b>${st.c}</b></div><div class="item"><span>${X('avgc')}</span><b>${pc.toLocaleString()}</b></div><div class="item"><span>${X('avgm')}</span><b>${pm.toLocaleString()}</b></div><p class="hint">${nc===undefined?X('boatdone'):pm&&G.money<nc?X('nextb2',Math.ceil((nc-G.money)/pm)):''}</p>`;
$('v-mkt').innerHTML=h}
$('v-mkt').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;mkm='';if(b.dataset.s==='all'){sellItems(G.bag);G.bag=[]}else{const i=+b.dataset.s;if(G.bag[i]){sellItems([G.bag[i]]);G.bag.splice(i,1)}}sfx('coin');save();stats();mkt()};
function svg(c,on){return `<svg viewBox="0 0 70 40" width="70" height="40" aria-hidden="true"><path d="M5 20Q25 0 50 12L66 4V36L50 28Q25 40 5 20Z" fill="${on?c:'#888'}"/><circle cx="16" cy="18" r="2.2" fill="${on?'#fff':'#555'}"/></svg>`}
function dex(){$('v-dex').innerHTML=dxh()+'<div class="dex">'+FISH.map(f=>{const d=G.dex[f.id],im=IMG[f.id],pic=im?`<img src="${im}" alt="${d?fn(f):''}" class="${d?'':'sil'}">`:svg(f.c,!!d),w=f.loc.map(i=>ln(LOCS.find(l=>l.id===i)));const u=X('cm');return d?`<article class="fc"><div class="pic">${pic}</div><div class="bd"><h3>${fn(f)}</h3><i>${!isTh()&&f.th?f.th+' · ':''}${f.sci}</i><p>${X('at')}${w.join(', ')}<br>${X('diff')} ${'★'.repeat(f.d)}${'☆'.repeat(5-f.d)}, ${X('bigger')}<br>${X('sizeLim')} ${slim(f)} ${X('cm')} · ${X('stockH')} ${Math.round(G.eco.sk[f.id])}%<br>${X('caught')} ${d.n} · ${X('rec')} ${d.max} ${u} (${X('range')} ${f.min}–${f.max} ${u})</p><p>${ff(f)}</p></div></article>`:`<article class="fc lock"><div class="pic">${pic}</div><div class="bd"><h3>???</h3><p>${X('nope')}${w.join(X('or'))}</p></div></article>`}).join('')+'</div>'}
const curV=()=>['fish','req','mkt','dock','dex','eco'].find(v=>!$('v-'+v).hidden);
$('tabs').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;sfx('click');document.querySelectorAll('#tabs .btn').forEach(x=>x.setAttribute('aria-pressed',x===b));['fish','req','mkt','dock','dex','eco'].forEach(v=>$('v-'+v).hidden=v!==b.dataset.v);if(b.dataset.v==='mkt')mkt();if(b.dataset.v==='req')reqUI();if(b.dataset.v==='eco')ecoUI();if(b.dataset.v==='dock')dock();if(b.dataset.v==='dex')dex()};
// settings
function applyTheme(){const t=G.set.theme,r=document.documentElement;if(t==='dark'||t==='light')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
function syncSet(){document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===G.set.theme));document.querySelectorAll('[data-lg]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lg===G.set.lang));$('mute').setAttribute('aria-pressed',G.set.mute);$('mute').textContent=G.set.mute?X('mute'):X('unmute');$('vol').value=G.set.vol}
function applyLang(){applyTheme();document.documentElement.lang=G.set.lang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=X(e.dataset.k));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=X(e.dataset.ph));$('hint').innerHTML=X('hint');document.title=X('title');cv.setAttribute('aria-label',X('title'));$('gear').setAttribute('aria-label',X('settings'));$('xset').setAttribute('aria-label',X('close'));stats();locs();const v=curV();if(v==='dock')dock();if(v==='dex')dex();if(v==='mkt')mkt();if(v==='req')reqUI();if(v==='eco')ecoUI();syncSet()}
function openSet(){sfx('click');$('ov').classList.add('on');$('rconf').hidden=true;$('cres').textContent='';syncSet();$('xset').focus()}
function closeSet(){$('ov').classList.remove('on');$('gear').focus()}
$('gear').onclick=openSet;$('xset').onclick=closeSet;$('ov').onclick=e=>{if(e.target.id==='ov')closeSet()};
document.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{G.set.lang=b.dataset.lg;save();applyLang();sfx('click')});
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{G.set.theme=b.dataset.th;save();applyTheme();syncSet();sfx('click')});
$('mute').onclick=()=>{G.set.mute=!G.set.mute;save();syncSet();sfx('click')};
$('vol').oninput=e=>{G.set.vol=+e.target.value;save()};$('vol').onchange=()=>sfx('click');
function cheat(){const c=$('code').value.trim().toLowerCase();let r='cx';
if(c==='givememoney'){G.money+=10000;r='cm_'}
else if(c==='bigbrain'){FISH.forEach(f=>{if(!G.dex[f.id])G.dex[f.id]={n:1,max:Math.round((f.min+f.max)/2)}});r='cb'}
else if(c==='jackup'){G.rod=G.reel=G.line=3;G.boat=4;r='cj'}
$('cres').textContent=X(r);$('cres').style.color=r==='cx'?'#b3261e':'var(--ok)';if(r!=='cx'){$('code').value='';sfx('coin');save();stats();locs();const v=curV();if(v==='dock')dock();if(v==='dex')dex();if(v==='mkt')mkt();if(v==='req')reqUI();if(v==='eco')ecoUI()}else sfx('lose')}
$('apply').onclick=cheat;$('code').onkeydown=e=>{if(e.key==='Enter')cheat()};
$('rst').onclick=()=>{$('rconf').hidden=false};$('rno').onclick=()=>{$('rconf').hidden=true};
$('ryes').onclick=()=>{const s=G.set;G=Object.assign(def(),{set:s});initEco();pend=null;fillReq();rollDem();selL=null;ph='idle';hold=false;msg('');save();$('rconf').hidden=true;stats();locs();const v=curV();if(v==='dock')dock();if(v==='dex')dex();if(v==='mkt')mkt();if(v==='req')reqUI();if(v==='eco')ecoUI();$('cres').textContent=X('done');$('cres').style.color='var(--ok)'};
fillReq();applyLang();
</script></body></html>
